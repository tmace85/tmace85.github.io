title: Tim Schiemann
url: https://www.tim-schiemann.de
baseurl: "" # explicit, otherwise github-metadata guesses /pages/<user> in local builds
remote_theme: mmistakes/minimal-mistakes@4.28.0
minimal_mistakes_skin: "dark"
repository: tmace85/tmace85.github.io
permalink: /blog/:year/:month/:day/:title/
plugins:
- jekyll-remote-theme
- jekyll-include-cache
- jekyll-sitemap
- jekyll-feed
- jekyll-seo-tag
include: ["_pages", ".well-known"]
# Rubriken and tags are listed on single pages; post meta links to their anchors
category_archive:
  type: liquid
  path: /rubriken/
tag_archive:
  type: liquid
  path: /tags/
# Keep repo tooling out of the published site (also lists Jekyll's default excludes)
exclude:
  - Gemfile
  - Gemfile.lock
  - mise.toml
  - workspace.code-workspace
  - vendor/
  - node_modules/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/

defaults:
  # posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      show_date: true

name                     : &name "Tim Schiemann" # &name is a YAML anchor which can be *referenced later
description              : &description "Blog von Tim Schiemann aus Berlin über KI und MCP, SRE-Alltag, Homelab und Laufen."
author:
  name             : *name # *name is a YAML reference pointing to the &anchor earlier
  avatar           : "/assets/images/tim_xletix.jpg"
  bio              : "Teamleiter by day, Homelab-Tüftler by night."
  location         : "Berlin"
  links:
    - label: "Mastodon"
      icon: "fab fa-fw fa-mastodon"
      url: https://social.vivaldi.net/@tmace85
    - label: "Bluesky"
      icon: "fab fa-fw fa-bluesky"
      url: https://bsky.app/profile/tim-schiemann.de
    - label: "PayPal Kaffeespende"
      url: https://paypal.me/TimRohde?country.x=DE&locale.x=de_DE
    - label: "bemodi - IT Dienstleister"
      icon: "fas fa-fw fa-building"
      url: "https://www.bemodi.de/"
    - label: "LinkedIN"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tschiemann"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tmace85"



footer:
  links:
    - label: "Mastodon"
      icon: "fab fa-fw fa-mastodon"
      url: https://social.vivaldi.net/@tmace85
    - label: "Bluesky"
      icon: "fab fa-fw fa-bluesky"
      url: https://bsky.app/profile/tim-schiemann.de
    - label: "bemodi - unabhängiger IT Dienstleister"
      icon: "fas fa-fw fa-building"
      url: "https://www.bemodi.de/"
    - label: "LinkedIN"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tschiemann"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tmace85"
    - label: "PayPal Kaffeespende"
      url: https://paypal.me/TimRohde?country.x=DE&locale.x=de_DE

      
# SEO Configuration
lang: de
og_image: /assets/images/og-default.jpg # default social preview (1200x630) for pages without their own
locale: de_DE


