<link rel="me" href="https://social.vivaldi.net/@tmace85" />
<meta name="fediverse:creator" content="@tmace85@vivaldi.net" />
{% if page.collection == "posts" %}
{%- assign post_image = page.header.og_image | default: page.header.image | default: page.header.overlay_image | default: site.og_image -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | strip | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "inLanguage": "de-DE",
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "image": {{ post_image | absolute_url | jsonify }},
  {%- if page.categories.size > 0 %}
  "articleSection": {{ page.categories | first | jsonify }},
  {%- endif %}
  {%- if page.tags.size > 0 %}
  "keywords": {{ page.tags | join: ", " | jsonify }},
  {%- endif %}
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ "/about/" | absolute_url | jsonify }}
  }
}
</script>
{% endif %}
